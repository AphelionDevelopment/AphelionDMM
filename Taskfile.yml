version: 3

includes:
  task_win:
    taskfile: ./Taskfile_windows.yml
    optional: true

vars:
  GIT_VERSION:
    sh: git describe --tags --always
  GIT_REV:
    sh: git rev-parse --short HEAD
  APP_NAME: StrongDMM
  BIN_DST: '{{.APP_NAME}}{{exeExt}}'
  RELAY_BIN_DST: 'apheliondmm-relay{{exeExt}}'
  HEALTHCHECK_BIN_DST: 'apheliondmm-healthcheck{{exeExt}}'
  BUILD_VARS: -X sdmm/internal/env.Version={{.GIT_VERSION}} -X sdmm/internal/env.Revision={{.GIT_REV}}
  LD_FLAGS_WINDOWS:
    sh: echo '{{if eq OS "windows"}}-H windowsgui -extldflags=-static{{end}}'
  LD_FLAGS: -s -w {{.BUILD_VARS}} {{.LD_FLAGS_WINDOWS}}
  BUILD_ARGS: -trimpath -ldflags="{{.LD_FLAGS}}"
  RELAY_BUILD_ARGS: -trimpath -ldflags="-s -w -X main.buildRevision={{.GIT_REV}}"

tasks:
  default:
    cmds:
      - task: clean
      - task: build

  clean-parser:
    dir: third_party/sdmmparser/src
    cmds:
      - cargo clean

  clean-editor:
    cmds:
      - '{{if eq OS "windows"}}cmd /C "if exist dst (rmdir /S /Q dst)"{{else}}rm -frd ./dst{{end}}'

  clean:
    deps:
      - clean-parser
      - clean-editor

  build-parser:
    dir: third_party/sdmmparser/src
    vars:
      RUST_TARGET_DYN: "{{if eq .OS \"Windows_NT\"}}1.82.0-x86_64-pc-windows-gnu{{else}}1.82.0{{end}}"
      RUSTUP_TOOLCHAIN: "{{.RUST_TARGET | default .RUST_TARGET_DYN}}"
    cmds:
      - RUSTUP_TOOLCHAIN={{.RUSTUP_TOOLCHAIN}} cargo build --release --locked

  build-editor:
    cmds:
      - go build {{.BUILD_ARGS}} -o "dst/{{.BIN_DST}}" .

  build-relay:
    cmds:
      - go build {{.RELAY_BUILD_ARGS}} -o "dst/{{.RELAY_BIN_DST}}" ./cmd/apheliondmm-relay
      - go build -trimpath -ldflags="-s -w" -o "dst/{{.HEALTHCHECK_BIN_DST}}" ./cmd/apheliondmm-healthcheck

  build-relay-image:
    cmds:
      - docker build --file deploy/relay/Dockerfile --build-arg APHELIONDMM_BUILD=self-hosted --build-arg APHELIONDMM_REVISION={{.GIT_REV}} --tag apheliondmm-relay:local .

  build:
    cmds:
      - task: build-parser
      - task: build-editor

  test-go:
    cmds:
      - go test ./... -count=1

  test-relay:
    cmds:
      - go test ./internal/aphelion/collab/protocolv2 ./internal/aphelion/collab/identity ./internal/aphelion/collab/authority ./internal/aphelion/collab/replica ./internal/aphelion/collab/container -count=1
      - go test -race ./internal/aphelion/collab/relay ./internal/aphelion/collab/relayclient ./internal/aphelion/collab/load ./internal/aphelion/smoke -count=1
      - go test ./cmd/apheliondmm-relay ./cmd/apheliondmm-healthcheck ./cmd/apheliondmm-loadtest -count=1

  verify-relay:
    cmds:
      - task: test-relay
      - task: build-relay

  test-rust:
    dir: third_party/sdmmparser/src
    vars:
      RUST_TARGET_DYN: "{{if eq .OS \"Windows_NT\"}}1.82.0-x86_64-pc-windows-gnu{{else}}1.82.0{{end}}"
      RUSTUP_TOOLCHAIN: "{{.RUST_TARGET | default .RUST_TARGET_DYN}}"
    cmds:
      - RUSTUP_TOOLCHAIN={{.RUSTUP_TOOLCHAIN}} cargo test --locked
      - RUSTUP_TOOLCHAIN={{.RUSTUP_TOOLCHAIN}} cargo fmt --all -- --check
      - RUSTUP_TOOLCHAIN={{.RUSTUP_TOOLCHAIN}} cargo clippy --all-targets --locked -- -D warnings

  verify:
    cmds:
      - task: test-go
      - task: test-rust
      - task: build

  run:
    deps:
      - build-parser
    cmds:
      - go run {{.BUILD_ARGS}} .

  release-files-unzip:
    dir: dst
    cmds:
      - mkdir -p bin archive
      - cp Windows/StrongDMM.exe bin/strongdmm-{{.GIT_VERSION}}-x86_64-pc-windows-gnu.exe
      - cp Linux/StrongDMM bin/strongdmm-{{.GIT_VERSION}}-x86_64-unknown-linux-gnu
      - cp macOS/StrongDMM bin/strongdmm-{{.GIT_VERSION}}-x86_64-apple-darwin
      - zip -rj archive/strongdmm-windows.zip Windows
      - zip -rj archive/strongdmm-linux.zip Linux
      - zip -rj archive/strongdmm-macos.zip macOS

  release-files-hash:
    dir: dst/bin
    cmds:
      - sha256sum ./strongdmm-{{.GIT_VERSION}}-x86_64-pc-windows-gnu.exe | tee -a "strongdmm-{{.GIT_VERSION}}-x86_64-pc-windows-gnu.exe.sha256"
      - sha256sum ./strongdmm-{{.GIT_VERSION}}-x86_64-unknown-linux-gnu | tee -a "strongdmm-{{.GIT_VERSION}}-x86_64-unknown-linux-gnu.sha256"
      - sha256sum ./strongdmm-{{.GIT_VERSION}}-x86_64-apple-darwin | tee -a "strongdmm-{{.GIT_VERSION}}-x86_64-apple-darwin.sha256"

  release-files:
    cmds:
      - task: release-files-unzip
      - task: release-files-hash
