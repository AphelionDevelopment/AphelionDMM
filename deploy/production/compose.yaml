name: apheliondmm-mapping

services:
  postgres:
    image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    environment:
      POSTGRES_DB: apheliondmm
      POSTGRES_USER: apheliondmm
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U apheliondmm -d apheliondmm"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    shm_size: 256mb
    mem_limit: 2g
    cpus: 2
    networks:
      - database

  hosted:
    image: apheliondmm-hosted:${APHELIONDMM_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: deploy/container/Dockerfile
      args:
        APHELIONDMM_BUILD: ${APHELIONDMM_BUILD:-self-hosted}
        APHELIONDMM_REVISION: ${APHELIONDMM_REVISION:-working-tree}
    command: ["-config", "/etc/apheliondmm/config.yaml"]
    user: "${APHELIONDMM_RUNTIME_UID:-65532}:${APHELIONDMM_RUNTIME_GID:-65532}"
    configs:
      - source: hosted-config
        target: /etc/apheliondmm/config.yaml
        mode: 0444
    secrets:
      - database_dsn
      - oidc_client_secret
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/apheliondmm-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2g
    cpus: 2
    stop_grace_period: 30s
    networks:
      - database
      - edge

configs:
  hosted-config:
    file: ./config.yaml

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  database_dsn:
    file: ./secrets/database_dsn.txt
  oidc_client_secret:
    file: ./secrets/oidc_client_secret.txt

volumes:
  postgres-data:

networks:
  database:
    internal: true
  edge:
    ipam:
      config:
        - subnet: 172.30.90.0/24
