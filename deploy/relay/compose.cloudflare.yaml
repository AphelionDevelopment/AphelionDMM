services:
  cloudflared:
    image: cloudflare/cloudflared:2026.7.3@sha256:e39ee8da81ad5e05d77f38d2f51c60ca51bf2a8450ac3abab50c17fdb91d91bf
    entrypoint: ["cloudflared", "--no-autoupdate"]
    command: ["tunnel", "run", "--token-file", "/run/secrets/cloudflare_tunnel_token"]
    user: "${APHELIONDMM_RUNTIME_UID:-65532}:${APHELIONDMM_RUNTIME_GID:-65532}"
    secrets:
      - cloudflare_tunnel_token
    depends_on:
      relay:
        condition: service_healthy
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    cpus: 0.5
    networks:
      - edge

secrets:
  cloudflare_tunnel_token:
    file: ./secrets/cloudflare_tunnel_token.txt

