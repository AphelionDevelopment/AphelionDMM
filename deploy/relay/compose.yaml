name: apheliondmm-relay

services:
  relay:
    image: apheliondmm-relay:${APHELIONDMM_RELAY_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: deploy/relay/Dockerfile
      args:
        APHELIONDMM_BUILD: ${APHELIONDMM_BUILD:-self-hosted}
        APHELIONDMM_REVISION: ${APHELIONDMM_REVISION:-working-tree}
    command: ["-config", "/etc/apheliondmm/relay.yaml"]
    user: "${APHELIONDMM_RUNTIME_UID:-65532}:${APHELIONDMM_RUNTIME_GID:-65532}"
    configs:
      - source: relay-config
        target: /etc/apheliondmm/relay.yaml
    healthcheck:
      test: ["CMD", "/apheliondmm-healthcheck"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 5s
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 1
    stop_grace_period: 15s
    networks:
      - edge

configs:
  relay-config:
    file: ${APHELIONDMM_RELAY_CONFIG:-./relay.yaml}

networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.91.0/24
