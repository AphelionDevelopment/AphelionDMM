name: CI
on: [push, pull_request]
jobs:
  lint-source-code:
    name: Lint Source Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Dependencies
        run: |
          sudo apt clean
          sudo apt update
          sudo apt install xorg-dev libgtk-3-dev

      - name: Setup Golang
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
        include:
          - os: ubuntu-latest
            rust-target: 1.82.0-x86_64-unknown-linux-gnu
          - os: windows-latest
            rust-target: 1.82.0-x86_64-pc-windows-gnu
          - os: macos-15-intel
            rust-target: 1.82.0-x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    name: Build - ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - if: contains(matrix.os, 'ubuntu')
        name: Dependencies (Linux)
        run: |
          sudo apt clean
          sudo apt update
          sudo apt install xorg-dev libgtk-3-dev

      - name: Setup Golang
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          architecture: x64
          cache: true

      - name: Setup Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust
        run: rustup toolchain install "${{ matrix.rust-target }}" --profile minimal --component rustfmt --component clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: third_party/sdmmparser/src

      - if: ${{ !contains(matrix.os, 'ubuntu') }}
        name: Test Go
        env:
          RUST_TARGET: ${{ matrix.rust-target }}
        run: task test-go

      - if: contains(matrix.os, 'ubuntu')
        name: Build Parser for Go Tests
        env:
          RUST_TARGET: ${{ matrix.rust-target }}
        run: task build-parser

      - if: contains(matrix.os, 'ubuntu')
        name: Test Go Commands
        run: go test ./cmd/... -count=1 -timeout=3m

      - if: contains(matrix.os, 'ubuntu')
        name: Test Go Aphelion
        run: go test ./internal/aphelion/... -count=1 -timeout=3m

      - if: contains(matrix.os, 'ubuntu')
        name: Test Go Application
        run: go test ./internal/app/... -count=1 -timeout=3m

      - if: contains(matrix.os, 'ubuntu')
        name: Test Go Foundations
        run: go test ./internal/dmapi/... ./internal/env/... ./internal/imguiext/... ./internal/platform/... ./internal/req/... ./internal/rsc/... ./internal/util/... ./third_party/... -count=1 -timeout=3m

      - name: Test Rust
        env:
          RUST_TARGET: ${{ matrix.rust-target }}
        run: task test-rust

      - if: contains(matrix.os, 'windows')
        name: Pre Build (Windows)
        run: task task_win:gen_syso

      - name: Build
        env:
          RUST_TARGET: ${{ matrix.rust-target }}
        run: task build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ runner.os }}
          path: dst/*
          if-no-files-found: error

  collaboration-resilience:
    name: Collaboration Resilience
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Dependencies
        run: |
          sudo apt clean
          sudo apt update
          sudo apt install xorg-dev libgtk-3-dev

      - name: Setup Golang
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          architecture: x64
          cache: true

      - name: Setup Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust
        run: rustup toolchain install 1.82.0-x86_64-unknown-linux-gnu --profile minimal

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: third_party/sdmmparser/src

      - name: Build Parser for Go
        env:
          RUST_TARGET: 1.82.0-x86_64-unknown-linux-gnu
        run: task build-parser

      - name: Collaboration Race Gate
        run: go test -race ./internal/aphelion/... -count=1

      - name: SQLite Restart and Fault Gates
        run: go test ./internal/aphelion/collab/store/sqlite -run 'Test(StoreSurvivesCloseAndReopen|AppendFailureRollsBackTransaction|CorruptCopiedDatabaseFailsWithoutChangingSource)$' -count=1

      - name: Collaboration Fault Gates
        run: go test ./internal/aphelion/collab/server -run 'Test(InterruptedSnapshotDoesNotLoseAcknowledgedOperation|RecoverDocumentRejectsDiscontinuousReplay|PresencePressureDoesNotBlockDurableDelivery)$' -count=1

      - name: Protocol Fuzz Smoke
        run: |
          go test ./internal/aphelion/collab/protocol -run '^$' -fuzz '^FuzzDecodeClient$' -fuzztime=5s
          go test ./internal/aphelion/collab/protocol -run '^$' -fuzz '^FuzzDecodeServer$' -fuzztime=5s

  relay-v2-gates:
    name: Protocol v2 Relay Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Dependencies
        run: |
          sudo apt clean
          sudo apt update
          sudo apt install xorg-dev libgtk-3-dev

      - name: Setup Golang
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          architecture: x64
          cache: true

      - name: Protocol v2 Fuzz Smoke
        run: |
          go test ./internal/aphelion/collab/protocolv2 -run '^$' -fuzz '^FuzzUnmarshalEnvelope$' -fuzztime=5s
          go test ./internal/aphelion/collab/protocolv2 -run '^$' -fuzz '^FuzzDecodeApplication$' -fuzztime=5s

      - name: Relay Race and Command Gates
        run: |
          go test -race ./internal/aphelion/collab/relay ./internal/aphelion/collab/relayclient ./internal/aphelion/collab/servicehost ./internal/aphelion/collab/load ./internal/aphelion/smoke -count=1
          go test ./cmd/apheliondmm-relay ./cmd/apheliondmm-healthcheck ./cmd/apheliondmm-loadtest ./internal/aphelion/collab/windowsservice -count=1

      - name: Cross-compile Windows Service
        run: |
          GOOS=windows GOARCH=amd64 go build -trimpath -o apheliondmm-relay.exe ./cmd/apheliondmm-relay
          GOOS=windows GOARCH=amd64 go build -trimpath -o apheliondmm-healthcheck.exe ./cmd/apheliondmm-healthcheck

      - name: Scan Relay Sources for Secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          scanners: secret

  relay-windows-service-gates:
    name: Windows Relay Service Gates
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Golang
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          architecture: x64
          cache: true

      - name: Windows Service and Package Tests
        shell: pwsh
        run: |
          go test ./cmd/apheliondmm-relay ./internal/aphelion/collab/servicehost ./internal/aphelion/collab/windowsservice -count=1 -timeout=5m

      - name: Build and Validate Service Package
        shell: pwsh
        run: |
          $packageRoot = Join-Path $env:RUNNER_TEMP 'relay-package'
          & ./deploy/relay/service.ps1 -Action Package -PackageRoot $packageRoot
          $stage = Join-Path $packageRoot 'AphelionDMM-Relay-Windows-x64'
          & (Join-Path $stage 'service.ps1') -Action Setup -PackageRoot $stage
          $cloudflared = Join-Path $env:RUNNER_TEMP 'cloudflared.exe'
          Invoke-WebRequest -Uri 'https://github.com/cloudflare/cloudflared/releases/download/2026.7.3/cloudflared-windows-amd64.exe' -OutFile $cloudflared
          & (Join-Path $stage 'service.ps1') -Action Validate -PackageRoot $stage -SkipCloudflare -CloudflaredPath $cloudflared

      - name: Exercise Native Service Lifecycle
        shell: pwsh
        run: |
          $packageRoot = Join-Path $env:RUNNER_TEMP 'relay-package'
          $stage = Join-Path $packageRoot 'AphelionDMM-Relay-Windows-x64'
          $installRoot = Join-Path $env:ProgramFiles "AphelionDMM Relay CI $env:GITHUB_RUN_ID"
          $dataRoot = Join-Path $env:ProgramData "AphelionDMM\Relay-CI-$env:GITHUB_RUN_ID"
          try {
            & (Join-Path $stage 'service.ps1') -Action Install -PackageRoot $stage -SkipCloudflare -InstallRoot $installRoot -DataRoot $dataRoot
            Invoke-RestMethod http://127.0.0.1:8080/v1/health/ready
            & (Join-Path $stage 'service.ps1') -Action Stop -PackageRoot $stage -SkipCloudflare -InstallRoot $installRoot -DataRoot $dataRoot
            & (Join-Path $stage 'service.ps1') -Action Start -PackageRoot $stage -SkipCloudflare -InstallRoot $installRoot -DataRoot $dataRoot
            Invoke-RestMethod http://127.0.0.1:8080/v1/version
            & (Join-Path $stage 'service.ps1') -Action Update -PackageRoot $stage -SkipCloudflare -InstallRoot $installRoot -DataRoot $dataRoot
            Invoke-RestMethod http://127.0.0.1:8080/v1/health/ready
          } catch {
            Write-Output "::error title=Windows relay lifecycle::$($_.Exception.Message)"
            Get-CimInstance -ClassName Win32_Service -Filter "Name='AphelionDMMRelay'" -ErrorAction SilentlyContinue | Format-List Name, State, StartMode, StartName, PathName, ExitCode
            Get-WinEvent -FilterHashtable @{ LogName = 'Application'; ProviderName = 'AphelionDMMRelay' } -MaxEvents 50 -ErrorAction SilentlyContinue | Format-List TimeCreated, LevelDisplayName, Message
            throw
          } finally {
            if (Get-Service -Name 'AphelionDMMRelay' -ErrorAction SilentlyContinue) {
              & (Join-Path $stage 'service.ps1') -Action Uninstall -PackageRoot $stage -SkipCloudflare -InstallRoot $installRoot -DataRoot $dataRoot -PurgeData
            }
          }

      - name: Upload Windows Relay Service Package
        uses: actions/upload-artifact@v4
        with:
          name: AphelionDMM-Relay-Windows-x64
          path: ${{ runner.temp }}/relay-package/AphelionDMM-Relay-Windows-x64.zip
          if-no-files-found: error

  hosted-collaboration-gates:
    name: Hosted Collaboration Gates
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.10-bookworm@sha256:38471f330eb885e04de130b768d6db4e10469e2311879c7e5c699f6d2d8a1c74
        env:
          POSTGRES_DB: aphelion_ci
          POSTGRES_PASSWORD: aphelion_ci_only
          POSTGRES_USER: aphelion_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aphelion_ci -d aphelion_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APHELION_POSTGRES_TEST_DSN: postgres://aphelion_ci:aphelion_ci_only@127.0.0.1:5432/aphelion_ci?sslmode=disable
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Dependencies
        run: |
          sudo apt clean
          sudo apt update
          sudo apt install xorg-dev libgtk-3-dev postgresql-client

      - name: Setup Golang
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          architecture: x64
          cache: true

      - name: PostgreSQL Conformance and Restore
        run: |
          export APHELION_POSTGRES_BIN="$(dirname "$(command -v pg_dump)")"
          go test ./internal/aphelion/collab/store/postgres -count=1 -v

      - name: Hosted Authentication and Configuration
        run: go test -race ./internal/aphelion/collab/auth ./internal/aphelion/collab/server -count=1

      - name: Protocol and Load Compatibility
        run: |
          go test ./internal/aphelion/collab/compat ./internal/aphelion/collab/load ./cmd/apheliondmm-compat ./cmd/apheliondmm-loadtest -count=1
          go test -tags=pilot ./internal/aphelion/collab/load -run '^TestPilotScenarioThroughPublicContracts$' -count=1 -timeout=60s -v

      - name: Reachable Vulnerability Gate
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

      - name: Build Hardened Hosted Image
        run: |
          docker build \
            --file deploy/container/Dockerfile \
            --build-arg APHELIONDMM_BUILD=ci \
            --build-arg APHELIONDMM_REVISION="${GITHUB_SHA}" \
            --tag apheliondmm-hosted:ci \
            .

      - name: Exercise Hosted Image Lifecycle
        env:
          APHELION_CONTAINER_TEST_IMAGE: apheliondmm-hosted:ci
        run: go test -tags=container ./internal/aphelion/collab/container -run '^TestHostedImageLifecycle$' -count=1 -timeout=5m -v

      - name: Scan Hosted Image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: apheliondmm-hosted:ci
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          scanners: vuln,secret,misconfig

  toolset-integration-contracts:
    name: Toolset Integration Contracts
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Golang
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          architecture: x64
          cache: true

      - name: Manifest, staging, and adapter contracts
        shell: pwsh
        run: go test ./internal/aphelion/integration/... -count=1

      - name: Record unavailable external integration gates
        shell: pwsh
        run: |
          & ./scripts/integration/verify-aphelion-stack.ps1 `
            -AphelionRoot $PWD.Path `
            -EvidencePath (Join-Path $env:RUNNER_TEMP 'aphelion-stack-plan.json') `
            -PlanOnly

      - name: Upload integration availability evidence
        uses: actions/upload-artifact@v6
        with:
          name: toolset-integration-availability
          path: ${{ runner.temp }}/aphelion-stack-plan.json
          if-no-files-found: error

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') # if tag starts with "v"
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Release Files
        uses: actions/download-artifact@v7
        with:
          path: dst/

      - name: Prepare Release Files
        run: task release-files

      - name: Attest Release Provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dst/bin/**
            dst/archive/**

      - name: Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: true
          prerelease: false
          files: |
            dst/bin/**
            dst/archive/**
